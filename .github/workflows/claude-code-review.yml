# Automated Claude code review on every pull request, preceded by a free,
# token-free Semgrep (OSS) security scan whose findings are posted as a sticky
# PR comment so the Claude review folds them into its analysis.
#
# This workflow uses the OAuth-bound CLAUDE_CODE_OAUTH_TOKEN (provisioned by
# `claude /install-github-app` from a local Claude Code session) rather than a
# metered API key, so the review draws against a Claude subscription rather
# than billing per-run. The Semgrep job replaces the retired metered
# claude-security-review.yml.
#
# Why this workflow is safe on a PUBLIC repository:
#
#   * Trigger is `pull_request`, NOT `pull_request_target`. `pull_request_target`
#     runs in the base repository's context and exposes secrets to code from
#     an untrusted fork PR (a credential-exfiltration risk). `pull_request`
#     runs the workflow definition from the BASE branch and does not expose
#     secrets to fork code by default.
#
#   * "Require approval for all outside collaborators" is enabled in the
#     repository's Actions settings. A first-time outside contributor's first
#     workflow run must be approved by a maintainer before any Action executes,
#     which bounds drive-by subscription-quota burn from random PRs.
#
#   * Permissions are scoped to what each job needs; no broader scope is granted.
#
#   * Every action is pinned to a full-length commit SHA with a version comment.
#     The plugin marketplace below is anthropics' own repository, so the trust
#     posture is the same as trusting the action itself.
#
# The CLAUDE_CODE_OAUTH_TOKEN repository secret must be provisioned by a
# maintainer (see SECURITY.md).

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  # Free, token-free SAST (Semgrep OSS). Runs first and posts a single sticky
  # findings comment so the Claude review job (which reads PR comments) folds the
  # results into its review. Replaces the metered claude-security-review.yml.
  # Runs on dependabot PRs too; only the comment-post step is best-effort there.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # SHA-pinned actions/setup-python v5.3.0
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Semgrep (OSS, pinned, no token)
        run: pip install semgrep==1.165.0

      - name: Run Semgrep
        # Packs: p/python and p/bash (the repo is Python plus a setup-dev.sh
        # shell script), p/secrets for committed credentials, p/ci for workflow
        # misconfig. No p/dockerfile (no Dockerfile in this repo). `|| true`
        # keeps the job green so findings are advisory (the Claude review and a
        # human decide), mirroring the comment-only behavior of the security job
        # it replaces.
        run: |
          semgrep scan --json --output semgrep.json \
            --config p/python \
            --config p/bash \
            --config p/secrets \
            --config p/ci || true

      - name: Post Semgrep findings as a sticky PR comment
        # Dependabot PRs run with a read-only token, so the comment post fails
        # there. continue-on-error keeps the job (and the run) green, so the
        # review workflow does not surface as a failed/skipped run on dependabot.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: '### Semgrep (OSS)'
        run: |
          COUNT=$(jq '.results | length' semgrep.json)
          if [ "$COUNT" -eq 0 ]; then
            printf '%s: no findings\n\n_Clean scan. Posted before the Claude review._\n' "$MARKER" > semgrep-comment.md
          else
            HIGH=$(jq '[.results[]|select(.extra.severity=="ERROR")]|length' semgrep.json)
            MED=$(jq '[.results[]|select(.extra.severity=="WARNING")]|length' semgrep.json)
            LOW=$(jq '[.results[]|select(.extra.severity=="INFO")]|length' semgrep.json)
            {
              printf '%s: %s findings\n\n' "$MARKER" "$COUNT"
              printf '<details><summary>HIGH (%s) · MEDIUM (%s) · LOW (%s)</summary>\n\n' "$HIGH" "$MED" "$LOW"
              printf '| Sev | Rule | Location | Message |\n|---|---|---|---|\n'
              jq -r '.results[] | "| \(.extra.severity|if .=="ERROR" then "HIGH" elif .=="WARNING" then "MEDIUM" else "LOW" end) | \(.check_id|split(".")|last) | \(.path):\(.start.line) | \(.extra.message|gsub("[\n|]";" ")|.[0:120]) |"' semgrep.json
              printf '\n</details>\n\n_Posted before the Claude review so findings are folded into the review._\n'
            } > semgrep-comment.md
          fi
          # Sticky: delete any prior Semgrep comment so the thread keeps one.
          gh api "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
            done
          gh pr comment "$PR" --body-file semgrep-comment.md

  # Wait for the "CI" workflow (ci.yml) to finish on this PR's head commit, then
  # post its result as a sticky comment. The Claude review `needs:` this job (so
  # it runs only after CI completes) and reads PR comments, so it folds the
  # pytest-matrix outcome into its review, the same sticky-comment hand-off the
  # semgrep job uses. The review action only supports pull_request context (not
  # workflow_run), so the gating is done in-workflow. This job adds no `uses:`
  # actions, so it stays compatible with the "pin actions to a full-length SHA"
  # repository setting (there is nothing to pin).
  await-tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Wait for CI and post the result as a sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MARKER: '### CI Tests'
        run: |
          # Poll the CI workflow's pull_request run for this head commit
          # (~30 min ceiling). ci.yml runs on both push and pull_request, so
          # event=pull_request selects the PR run specifically. ci.yml's only
          # job is `test` (ruff lint + format-check + pytest matrix); it has no
          # ref-guarded deploy job, so the whole-run conclusion reflects the
          # test result.
          status="missing"; conclusion=""; runid=""
          for i in $(seq 1 60); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=pull_request&per_page=1" 2>/dev/null || echo '{}')
            status=$(echo "$run" | jq -r '.workflow_runs[0].status // "missing"')
            if [ "$status" = "completed" ]; then
              conclusion=$(echo "$run" | jq -r '.workflow_runs[0].conclusion')
              runid=$(echo "$run" | jq -r '.workflow_runs[0].id')
              break
            fi
            sleep 30
          done
          {
            printf '%s\n\n' "$MARKER"
            if [ "$conclusion" = "success" ]; then
              printf '✅ **Tests passed**: ruff lint, format-check, and the pytest matrix (Python 3.10-3.12) are green on `%s`.\n' "${SHA:0:9}"
            elif [ "$conclusion" = "failure" ]; then
              printf '❌ **Tests failed** on `%s`. Failing output (truncated):\n\n```\n' "${SHA:0:9}"
              gh run view "$runid" --repo "$REPO" --log-failed 2>/dev/null \
                | grep -iE 'FAILED|ERROR |AssertionError|assert |Error:|E   |short test summary' \
                | head -40 || true
              printf '```\n'
            else
              printf '⚠️ CI did not complete within the wait window (last status: %s). The review proceeds without a final test result; confirm the CI check before merge.\n' "${conclusion:-$status}"
            fi
            printf '\n_Posted before the Claude review so the test outcome is folded into the review._\n'
          } > ci-tests-comment.md
          # Sticky: replace any prior CI Tests comment so the thread keeps one.
          gh api "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
            done
          # --repo is required: this job has no checkout, so gh cannot infer the
          # repo from git context (unlike the semgrep job).
          gh pr comment "$PR" --repo "$REPO" --body-file ci-tests-comment.md

  claude-review:
    if: ${{ github.actor != 'dependabot[bot]' }}
    # Both gates post their sticky comments before the review runs:
    #   semgrep -> "Semgrep (OSS)"; await-tests -> "CI Tests".
    needs: [semgrep, await-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # SHA-pinned anthropics/claude-code-action v1.0.133. Bump by re-resolving
      # the v1 tag's target commit:
      #   gh api repos/anthropics/claude-code-action/git/refs/tags/v1
      - name: Run Claude code review
        id: claude-review
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          include_fix_links: true
          track_progress: true
          allowed_bots: 'claude[bot]'
          claude_args: '--model opus'
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            This PR's CI has already run. A "Semgrep (OSS)" comment and a "CI Tests" comment
            (the ruff lint, format-check, and pytest-matrix outcome, with any failing test
            output) are posted on the PR. Read both and factor them into your review. You do NOT
            have a runnable test environment here and cannot run the suite yourself, so rely on
            the "CI Tests" comment for results and do not tell the reader to "confirm CI is green".
            Always include a "Test coverage" section in your review (never omit it):
            - If the "CI Tests" comment shows a failure, call it out as a blocking finding and
            relate the failing tests to the diff where you can.
            - If this PR changes application or library source code in a way that warrants tests
            (new or changed behavior, bug fixes, new branches or edge cases) and does NOT add or
            update corresponding tests, flag it as a HIGH-severity finding naming the specific
            untested change.
            - If the change is exempt (docs-only, README, comments, formatting, or pure
            configuration: CI YAML, lockfile bumps, asset-only, version bumps) or existing tests
            already cover it, say so explicitly in one line (e.g. "No test changes needed:
            <reason>") rather than staying silent.
            - If tests were added or changed, briefly assess whether they meaningfully cover the change.
