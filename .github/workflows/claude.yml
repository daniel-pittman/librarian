# The interactive `@claude` bot: responds to `@claude` mentions in issues, PR
# comments, PR review comments, and PR reviews.
#
# Trust rule: the actor AND the author of the thread it is working on must both be
# OWNER, MEMBER or COLLABORATOR. A trusted maintainer commenting on an outside
# contributor's issue or PR would otherwise hand attacker-written text (the issue
# body, the PR description, the diff) to an agent that can act on the repository.
# Comments from third parties inside a trusted author's thread are still context
# the agent reads; the tool restriction below bounds what it can do with them.
# CONTRIBUTOR (anyone with a merged PR) is deliberately excluded: write access is
# the bar, not historical contribution.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription token, no metered API key). The
# action exchanges the job's OIDC token for a short-lived GitHub App token, so
# `id-token: write` is required. Workflow permissions below limit only
# GITHUB_TOKEN; the App token's reach comes from the Claude GitHub App
# installation.
#
# Permissions are the minimum: `contents: read` because the bot does not push
# branches (it replies with fix links a maintainer clicks), `pull-requests: write`
# and `issues: write` to post its replies, `actions: read` to read CI results.
#
# The CLAUDE_CODE_OAUTH_TOKEN repository secret must be provisioned by a
# maintainer (see SECURITY.md).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      ((github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
       (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
       (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # Read, search and read-only git. No shell beyond those git commands, no edit
      # or write tools, and git's file-writing options are blocked.
      - name: Run Claude Code
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_fix_links: true
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
            --disallowedTools "Bash(git diff --output:*),Bash(git diff --ext-diff:*),Bash(git diff --textconv:*),Bash(git log --output:*),Bash(git log --ext-diff:*),Bash(git log --textconv:*),Bash(git show --output:*),Bash(git show --ext-diff:*),Bash(git show --textconv:*)"
