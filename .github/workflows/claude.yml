# The interactive `@claude` bot: responds to `@claude` mentions in issues, PR
# comments, PR review comments, and PR reviews.
#
# Trust rule: the actor AND the author of the thread it is working on must both be
# OWNER, MEMBER or COLLABORATOR. A trusted maintainer commenting on an outside
# contributor's issue or PR would otherwise hand attacker-written text (the issue
# body, the PR description, the diff) to the agent. Comments from third parties
# inside a trusted author's thread are still context the agent reads; the tool
# limits below bound what it can do with them. CONTRIBUTOR (anyone with a merged
# PR) is deliberately excluded: write access is the bar, not historical
# contribution.
#
# Pull requests from forks are skipped even when the author is trusted: the
# action checks out the PR branch, and a fork branch is code from outside this
# repository.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN (subscription token, no metered API key). The
# action exchanges the job's OIDC token for a short-lived token of the Claude
# GitHub App, so `id-token: write` is required. The workflow permissions below
# limit only GITHUB_TOKEN; what the App token can do is set by the App
# installation's permissions, which are the real ceiling on the agent.
#
# Permissions: `contents: read` because the bot does not push branches (it
# replies with fix links a maintainer clicks), `pull-requests: write` and
# `issues: write` to post its replies, `actions: read` to read CI results.
#
# The CLAUDE_CODE_OAUTH_TOKEN repository secret must be provisioned by a
# maintainer (see SECURITY.md).

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      ((github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
       (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
       (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # The fork check reads the event payload and asks the API for PR contexts
      # only; issues never come from a fork. Any lookup failure fails the job
      # rather than letting the agent run on an unknown branch.
      - name: Skip pull requests from forks
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(jq -r 'if .pull_request then .pull_request.number elif .issue.pull_request then .issue.number else empty end' "$GITHUB_EVENT_PATH")
          if [ -z "$pr" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cross=$(gh pr view "$pr" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)
          case "$cross" in
            false) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            true)
              echo "::notice::PR #$pr comes from a fork; the bot does not run on fork branches."
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Could not tell whether PR #$pr comes from a fork (got '$cross')."
              exit 1 ;;
          esac

      # SHA-pinned actions/checkout v4.2.2
      - name: Check out the repository
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tools: read and search only. The action adds its own tools to whatever
      # --allowedTools names (git add/commit/rm and its git-push.sh wrapper, or
      # the commit_files and delete_files MCP tools when commit signing is on,
      # plus file edits through its acceptEdits permission mode), so the allow
      # list alone restricts nothing. The deny list does: a deny rule beats
      # every allow rule, and the bare `Bash` entry removes the shell, which
      # takes the action's git and push tools with it. No git commands either,
      # because git accepts abbreviated long options (`--outp=` for
      # `--output=`) that no pattern list can pin.
      #
      # The action also allows Read on any path, so the Read denies keep the
      # agent away from where this job's credentials sit on the runner: the
      # process environment under /proc, and .git/config, where the action
      # writes the App token into the remote URL. The same rules stop Grep
      # from reading those files.
      - name: Run Claude Code
        if: steps.guard.outputs.skip == 'false'
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_fix_links: true
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Read(./.git/**),Read(//proc/**)"
