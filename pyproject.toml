[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "librarian-tracker"
version = "1.8.3"
description = "A local-first, plain-text activity tracker with a pluggable schema and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "librarian contributors" }]
keywords = ["activity-tracking", "yaml", "cli", "mcp", "portfolio", "performance-review"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The MCP server is optional — the CLI works without it.
mcp = ["mcp>=1.0,<2"]
# Everything needed to develop and test the project.
dev = [
    "mcp>=1.0,<2",
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
librarian = "librarian.cli:main"

[project.urls]
# Placeholder — replace with the real repository URL once an upstream exists.
Homepage = "https://example.com/librarian"

[tool.setuptools]
packages = ["librarian"]

[tool.setuptools.package-data]
librarian = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A pragmatic rule set: pyflakes, pycodestyle, isort, bugbear, comprehensions,
# pyupgrade. Strict enough to catch real problems without bikeshedding.
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over import hygiene in places.
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
